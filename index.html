<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>2D Gaussian Random Walk</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<h1>2D Gaussian Random Walk</h1>

<div class="subtitle">
    Continuous Gaussian random walkers
</div>

<div class="controls">

```
<button id="startButton">Start</button>
<button id="pauseButton">Pause</button>
<button id="resetButton">Reset</button>

<label>
    Walkers:
    <input
        id="walkerSlider"
        type="range"
        min="1"
        max="50"
        value="15">
    <span id="walkerValue">15</span>
</label>

<label>
    Sigma:
    <input
        id="sigmaSlider"
        type="range"
        min="0.1"
        max="3.0"
        step="0.1"
        value="1.0">
    <span id="sigmaValue">1.0</span>
</label>
```

</div>


<div class="info">

    Time:
    <span id="timeDisplay">0.00</span> s

    &nbsp;&nbsp;|&nbsp;&nbsp;

    Mean distance:
    <span id="meanDisplay">0.00</span>

</div>

<div class="container">

    <div>
        <canvas
            id="walkCanvas"
            width="600"
            height="600">
        </canvas>
    </div>

    <div>
        <canvas
            id="graphCanvas"
            width="600"
            height="600">
        </canvas>
    </div>

</div>

<script src="simulation.js"></script>
```

</body>

</html>
