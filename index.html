<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>2D Gaussian Random Walk</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>2D Gaussian Random Walk</h1>

    <div class="subtitle">
        15 continuous Gaussian walkers
    </div>

    <div class="controls">
        <button id="startButton">Start</button>
        <button id="pauseButton">Pause</button>
        <button id="resetButton">Reset</button>
    </div>

    <div class="info">
        Time:
        <span id="timeDisplay">0.00</span>

        &nbsp;&nbsp;|&nbsp;&nbsp;

        Mean distance:
        <span id="meanDisplay">0.00</span>
    </div>

    <div class="container">

        <div>
            <canvas
                id="walkCanvas"
                width="600"
                height="600">
            </canvas>
        </div>

        <div>
            <canvas
                id="graphCanvas"
                width="600"
                height="600">
            </canvas>
        </div>

    </div>

    <script src="simulation.js"></script>

</body>

</html>
